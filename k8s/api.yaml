apiVersion: apps/v1
kind: Deployment
metadata:
  name: labstream-api
spec:
  replicas: 2
  selector: {matchLabels: {app: labstream-api}}
  template:
    metadata: {labels: {app: labstream-api}}
    spec:
      containers:
      - name: api
        image: labstream-image
        ports: [{containerPort: 5000}]
        envFrom: [{configMapRef: {name: labstream-config}}, {secretRef: {name: labstream-secrets}}]
        readinessProbe: {httpGet: {path: /health/ready, port: 5000}, initialDelaySeconds: 10}
        livenessProbe: {httpGet: {path: /health/live, port: 5000}, initialDelaySeconds: 10}
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: labstream-api}
spec:
  selector: {app: labstream-api}
  ports: [{port: 80, targetPort: 5000}]
