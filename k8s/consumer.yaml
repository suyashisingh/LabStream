apiVersion: apps/v1
kind: Deployment
metadata:
  name: labstream-consumer
spec:
  replicas: 2
  selector: {matchLabels: {app: labstream-consumer}}
  template:
    metadata: {labels: {app: labstream-consumer}}
    spec:
      containers:
      - name: consumer
        image: labstream-image
        command: ["python", "consumer.py"]
        envFrom: [{configMapRef: {name: labstream-config}}, {secretRef: {name: labstream-secrets}}]
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
